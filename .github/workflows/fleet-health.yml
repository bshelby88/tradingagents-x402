name: Fleet Health + 402 Challenge Check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check all active x402 services
        shell: bash
        run: |
          set -uo pipefail
          CANON=0x7861DB4EfC14A1ed5dd8C96c528A3796560F1393
          declare -a ENTRIES=(
            "sentry-forge-x402    /api/dispute-pack        500000 $CANON"
            "dispute-forge-x402   /api/dispute-pack        750000 $CANON"
            "nanobanana-x402      /api/generate-image        10000 $CANON"
            "vault-pro-x402       /api/scaffold-project       50000 $CANON"
            "power-pack-x402      /api/score-email            10000 $CANON"
            "suprapack-x402       /api/find-skill             30000 $CANON"
            "tradingagents-x402   /api/analyze-ticker         30000 $CANON"
            "nft-alpha-x402       /api/nft-signal             20000 $CANON"
            "lingua-x402          /api/translate            1000000 $CANON"
            "briefsnap-x402       /api/summarize            1000000 $CANON"
            "contract-eye-x402    /api/analyze-contract       50000 $CANON"
            "royal-ruby-x402      /api/law-lookup            250000 $CANON"
            "royal-feel-x402      /api/lint-copy            2000000 $CANON"
          )

          FAIL=0
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          for entry in "${ENTRIES[@]}"; do
            read -r app endpoint expected_amount expected_wallet <<< "$entry"
            base="https://$app.fly.dev"

            # Request schemas are validated before x402 payment middleware.
            # Use harmless, schema-valid synthetic data so probes reach the 402 challenge.
            case "$app" in
              sentry-forge-x402|dispute-forge-x402)
                request_body='{"customer_name":"Synthetic Health Probe","state":"LA","contract_type":"credit_card","default_date":"2026-01-01","alleged_balance":100,"narrative":"Synthetic monitoring request","collector_letter":"Synthetic collection notice"}' ;;
              nanobanana-x402)
                request_body='{"prompt":"synthetic health-check image"}' ;;
              vault-pro-x402)
                request_body='{"goal":"Synthetic health-check project"}' ;;
              power-pack-x402)
                request_body='{"subject":"Synthetic health check for API monitoring","body":"This synthetic message is long enough to pass request validation and is never processed without payment."}' ;;
              suprapack-x402)
                request_body='{"query":"synthetic health check"}' ;;
              tradingagents-x402)
                request_body='{"ticker":"NVDA"}' ;;
              nft-alpha-x402)
                request_body='{"collection":"azuki"}' ;;
              lingua-x402)
                request_body='{"text":"Synthetic health check sentence.","to":"es"}' ;;
              briefsnap-x402)
                request_body='{"text":"Synthetic health check document. It contains enough words to pass request validation and is never processed without payment."}' ;;
              contract-eye-x402)
                request_body='{"address":"0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"}' ;;
              royal-ruby-x402)
                request_body='{"query":"FCRA dispute timelines"}' ;;
              royal-feel-x402)
                request_body='{"copy":"Synthetic health-check copy for monitoring."}' ;;
              *)
                echo "::error::No safe probe payload configured for $app"
                FAIL=1
                continue ;;
            esac

            health=$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -m 30 -o /dev/null -w '%{http_code}' "$base/health" || echo ERR)
            if [ "$health" != "200" ]; then
              echo "::error::$app health=$health"
              FAIL=1
              continue
            fi

            headers="$TMP_DIR/$app.headers"
            status=$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -m 30 -D "$headers" -o /dev/null -w '%{http_code}' \
              -X POST "$base$endpoint" \
              -H 'content-type: application/json' \
              -d "$request_body")
            if [ "$status" != "402" ]; then
              echo "::error::$app expected 402, got $status"
              FAIL=1
              continue
            fi

            # Accept both legacy payment-required and current x-payment-required headers.
            challenge=$(awk 'BEGIN{IGNORECASE=1} /^(x-)?payment-required:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' "$headers")
            if [ -z "$challenge" ]; then
              echo "::error::$app missing payment-required header"
              FAIL=1
              continue
            fi

            if ! decoded=$(printf '%s' "$challenge" | base64 -d 2>/dev/null); then
              echo "::error::$app payment-required is not valid base64"
              FAIL=1
              continue
            fi
            if ! network=$(printf '%s' "$decoded" | jq -er '.accepts[0].network') || \
               ! amount=$(printf '%s' "$decoded" | jq -er '.accepts[0].amount') || \
               ! payto=$(printf '%s' "$decoded" | jq -er '.accepts[0].payTo'); then
              echo "::error::$app malformed payment-required metadata"
              FAIL=1
              continue
            fi

            if [ "$network" != "eip155:8453" ]; then
              echo "::error::$app network=$network"
              FAIL=1
              continue
            fi
            if [ "$amount" != "$expected_amount" ]; then
              echo "::error::$app amount=$amount expected=$expected_amount"
              FAIL=1
              continue
            fi
            if [[ ! "$payto" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
              echo "::error::$app invalid payTo address"
              FAIL=1
              continue
            fi
            if [ "${payto,,}" != "${expected_wallet,,}" ]; then
              echo "::error::$app payTo=$payto differs from expected wallet $expected_wallet"
              FAIL=1
              continue
            fi

            printf 'OK %-22s health=%s network=%s amount=%s\n' "$app" "$health" "$network" "$amount"
          done

          # Negative control: receipt verifier must reject a forged receipt
          receipt=$(curl -sS -m 30 'https://tradingagents-x402.fly.dev/api/receipts/verify?receipt=%7B%7D' | jq -r '.valid')
          if [ "$receipt" != "false" ]; then
            echo "::error::tradingagents receipt verifier rejected its negative-control test"
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Fleet health or x402 metadata drift detected"
            exit 1
          fi
          echo "All 13 active x402 services passed health, challenge, pricing, network, and canonical-payTo checks."
