name: Fleet Health + 402 Challenge Check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check all active x402 services
        shell: bash
        run: |
          set -uo pipefail
          declare -a ENTRIES=(
            "sentry-forge-x402   /api/dispute-pack      5000000 0x9b8a2786a3df7a7837ccfc4e792e9eb90a36f72f"
            "nanobanana-x402     /api/generate-image      10000 0x9b8a2786a3df7a7837ccfc4e792e9eb90a36f72f"
            "vault-pro-x402      /api/scaffold-project    50000 0x9b8a2786a3df7a7837ccfc4e792e9eb90a36f72f"
            "power-pack-x402     /api/score-email         10000 0x9b8a2786a3df7a7837ccfc4e792e9eb90a36f72f"
            "suprapack-x402      /api/find-skill          30000 0x9b8a2786a3df7a7837ccfc4e792e9eb90a36f72f"
            "tradingagents-x402  /api/analyze-ticker      50000 0x9e6A0CE78Bb2915d0758cc6A1cE8eA77f1B71770"
            "nft-alpha-x402      /api/nft-signal          20000 0x9e6A0CE78Bb2915d0758cc6A1cE8eA77f1B71770"
          )

          FAIL=0
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          for entry in "${ENTRIES[@]}"; do
            read -r app endpoint expected_amount expected_payto <<< "$entry"
            base="https://$app.fly.dev"

            # Request schemas are validated before x402 payment middleware.
            # Use harmless, schema-valid synthetic data so probes reach the 402 challenge.
            case "$app" in
              sentry-forge-x402)
                request_body='{"customer_name":"Synthetic Health Probe","state":"LA","contract_type":"credit_card","default_date":"2026-01-01","alleged_balance":100,"narrative":"Synthetic monitoring request","collector_letter":"Synthetic collection notice"}' ;;
              nanobanana-x402)
                request_body='{"prompt":"synthetic health-check image"}' ;;
              vault-pro-x402)
                request_body='{"goal":"Synthetic health-check project"}' ;;
              power-pack-x402)
                request_body='{"subject":"Synthetic health check for API monitoring","body":"This synthetic message is long enough to pass request validation and is never processed without payment."}' ;;
              suprapack-x402)
                request_body='{"query":"synthetic health check"}' ;;
              tradingagents-x402)
                request_body='{"ticker":"NVDA"}' ;;
              nft-alpha-x402)
                request_body='{}' ;;
              *)
                echo "::error::No safe probe payload configured for $app"
                FAIL=1
                continue ;;
            esac

            health=$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -m 30 -o /dev/null -w '%{http_code}' "$base/health" || echo ERR)
            if [ "$health" != "200" ]; then
              echo "::error::$app health=$health"
              FAIL=1
              continue
            fi

            headers="$TMP_DIR/$app.headers"
            status=$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -m 30 -D "$headers" -o /dev/null -w '%{http_code}' \
              -X POST "$base$endpoint" \
              -H 'content-type: application/json' \
              -d "$request_body")
            if [ "$status" != "402" ]; then
              echo "::error::$app expected 402, got $status"
              FAIL=1
              continue
            fi

            challenge=$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' "$headers")
            if [ -z "$challenge" ]; then
              echo "::error::$app missing payment-required header"
              FAIL=1
              continue
            fi

            if ! decoded=$(printf '%s' "$challenge" | base64 -d 2>/dev/null); then
              echo "::error::$app payment-required is not valid base64"
              FAIL=1
              continue
            fi
            if ! network=$(printf '%s' "$decoded" | jq -er '.accepts[0].network') || \
               ! amount=$(printf '%s' "$decoded" | jq -er '.accepts[0].amount') || \
               ! payto=$(printf '%s' "$decoded" | jq -er '.accepts[0].payTo'); then
              echo "::error::$app malformed payment-required metadata"
              FAIL=1
              continue
            fi

            if [ "$network" != "eip155:8453" ]; then
              echo "::error::$app network=$network"
              FAIL=1
              continue
            fi
            if [ "$amount" != "$expected_amount" ]; then
              echo "::error::$app amount=$amount expected=$expected_amount"
              FAIL=1
              continue
            fi
            if [[ ! "$payto" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
              echo "::error::$app invalid payTo address"
              FAIL=1
              continue
            fi

            if [ "${payto,,}" != "${expected_payto,,}" ]; then
              echo "::error::$app payTo differs from expected service wallet"
              FAIL=1
              continue
            fi

            printf 'OK %-22s health=%s network=%s amount=%s\n' "$app" "$health" "$network" "$amount"
          done

          receipt=$(curl -sS -m 30 'https://tradingagents-x402.fly.dev/api/receipts/verify?receipt=%7B%7D' | jq -r '.valid')
          if [ "$receipt" != "false" ]; then
            echo "::error::tradingagents receipt verifier rejected its negative-control test"
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Fleet health or x402 metadata drift detected"
            exit 1
          fi
          echo "All 7 active x402 services passed health, challenge, pricing, network, and payTo checks."
