app = "tradingagents-x402"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  X402_PAY_TO = "0x9b8a27e03ceba490953cda8ab1291c0e13baf72f"
  PORT = "3000"
  TRADINGAGENTS_DIR = "/app/TradingAgents"
  PYTHON_BIN = "python3"
  TRADINGAGENTS_LLM_PROVIDER = "anthropic"
  TRADINGAGENTS_DEEP_THINK_LLM = "claude-haiku-4-5-20251001"
  TRADINGAGENTS_QUICK_THINK_LLM = "claude-haiku-4-5-20251001"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Real TradingAgents analysis runs 2-5 min (verified live: ~131s for 1 analyst).
  # Fly Proxy kills idle connections at 60s by default — widen the idle window
  # so a paid analysis can finish before the proxy cuts it (RE-AUDIT Nov 16).
  [http_service.http_options]
    idle_timeout = 600

  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 8

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  cpus = 2
